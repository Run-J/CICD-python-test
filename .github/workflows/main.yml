name: Python Lint

on:
  push:
    branches: [dev]
    paths:
      - "factorial.py"
      - "lint.py"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pylint
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint==4.1.2

      - name: Lint with Pylint
        run: python lint.py
